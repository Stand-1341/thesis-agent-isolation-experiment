# azd project: thesis-agent-isolation-experiment
#
# Current v3 topology: azure_vm + azure_functions_flex +
# azure_container_apps_sandboxes. The legacy aca_jobs composition remains
# selectable only for archived v2 compatibility.
#
# `azd up` runs a deployment pipeline, not the study:
#   resolve-inputs : validate/create the external CA, SSH key, operator /32,
#                    VM sizes, image version, prefixes and operator identity
#   preflight      : subscription/RBAC/provider/quota/budget/policy and ARM
#                    what-if gate; nothing is billed until it passes
#   provision      : infra/main.bicep stage 'foundation'
#   postprovision  : seed Key Vault secrets, publish the pinned agent image,
#                    preview the full stage, provision stage 'full', publish
#                    identical Functions packages, create Sandbox disk images,
#                    bootstrap the private research host, and configure outputs
#   postup         : always emit validation and readiness artifacts, then return
#                    the validation result
#
# Measured study execution is deliberately NOT part of `azd up`.
# The v3 protocol remains frozen with measuredExecutionEnabled=false until the
# separate pilot, retention, verifier, and owner-authorization gates pass.
name: thesis-agent-isolation-experiment
metadata:
  template: thesis-agent-isolation-experiment@custom

infra:
  provider: bicep
  path: infra
  module: main

# No azd service definitions: workloads are installed by the Bicep full stage
# and the deploy/ hooks, not by `azd deploy`.

hooks:
  preprovision:
    run: node deploy/resolve-inputs.mjs && node deploy/preflight.mjs
    continueOnError: false
    interactive: false
  postprovision:
    run: node deploy/postprovision.mjs
    continueOnError: false
    interactive: false
  postup:
    run: node deploy/postup.mjs
    continueOnError: false
    interactive: false
  predown:
    run: node deploy/teardown.mjs --guard
    continueOnError: false
    interactive: false
